voice_id_file: data/elevenlabs_voice_id.txt   # written by clone_voice.py
dst: data/voice_preview.mp3                    # short preview clip to listen to before full synthesis
model_id: eleven_multilingual_v2              # same model as synthesize_speech.py
output_format: mp3_44100_128
language_code: ru

# A short, representative snippet in the teacher's style/vocabulary (Russian + code-switched
# English dance terms) so the preview exercises the same kind of text a real class does. Override
# on the command line with text="..." to audition your own line.
text: >-
  Давайте начнём. Мягко перенесите вес на стопы, почувствуйте ось, вытяжение вверх. Дыхание
  спокойное. Найдите своё flow, ощущение full body experience. Не торопитесь - слушайте тело.

# Same settings as synthesize_speech.yaml - keep them in sync so the preview reflects the final
# result. ElevenLabs speed is 0.7 (slowest) - 1.2 (fastest), default 1.0.
voice_settings:
  speed: 0.85
  stability: 0.5
  similarity_boost: 0.85
  style: 0.0
  use_speaker_boost: true
