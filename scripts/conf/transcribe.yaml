src: data/audio          # folder containing MP3 files
dst: data/transcriptions # folder where text files will be saved
model: large-v3           # faster-whisper resolves this to the CTranslate2-converted checkpoint automatically
model_dir: models/whisper # local cache for the converted model weights; downloaded automatically on first run
device: cuda              # "cuda" for a GPU box, "cpu" for local testing on this machine
compute_type: float16     # float16 is the standard GPU choice (fast, no meaningful quality loss); use "int8" or "float32" on CPU
language: ru              # primary language of the recordings

# Voice-activity detection trims music/silence before Whisper ever sees it - the single
# biggest source of hallucinated text (e.g. "Добро пожаловать в Казахстан", a documented
# Whisper artifact during non-speech audio) comes from exactly those stretches.
vad_model_dir: models/silero_vad # local cache for the Silero VAD model; run scripts/transcribe/download_vad_model.py once with internet
vad_threshold: 0.5               # speech-probability cutoff per audio frame; raise if speech is still being dropped, lower if music/silence still leaks through
# Library default (100ms) fragments continuous speech into many sub-2s segments on every
# micro-pause/breath; measured on a real file, raising this to 500ms cut segment count from
# 135 to 57 over a 10-minute sample with a much healthier median length (4.3s vs 2.6s).
vad_min_silence_duration_ms: 500
# Silero's default (30ms) leaves little buffer around each detected speech segment; a tighter pad
# risks clipping word onsets/offsets right at clip boundaries. A bit more headroom costs a few ms
# of silence/frame.
vad_speech_pad_ms: 100

# transcribe.py hands faster-whisper each VAD speech segment explicitly (as clip_timestamps),
# which bypasses its own internal <=30s auto-chunking entirely - a single clip longer than the
# model's fixed 30-second window gets silently truncated (only the first 30s transcribed) rather
# than an error, so any VAD segment longer than this is pre-split into consecutive sub-clips here.
# Kept a bit under Whisper's native 30s window for margin. This has nothing to do with pause
# markers (which key off min_pause_seconds/min_micro_pause_seconds below) or with re-seeding
# initial_prompt - faster-whisper's batched pipeline re-applies initial_prompt fresh to every
# clip regardless of how many there are, so splitting a long segment here doesn't affect that.
max_clip_seconds: 28
# Batched transcription: instead of decoding one clip at a time, faster-whisper processes this
# many clips together per forward pass on the GPU. Every VAD-detected speech burst is its own
# clip, so a typical file has plenty to batch - raise this if GPU memory allows, for more
# throughput; lower it if you hit an out-of-memory error.
batch_size: 16

# Threshold, in real elapsed seconds between two VAD-detected speech segments, above which the
# gap is treated as a structural pause worth marking in the transcript (e.g. a movement/music
# break), as opposed to normal breath/sentence gaps - those are already kept out of the reported
# segment list in the first place by vad_min_silence_duration_ms. Tunable.
min_pause_seconds: 8.0
# Second, lower threshold of the same two-tier system: gaps >= min_micro_pause_seconds but
# < min_pause_seconds become a "[МИКРОПАУЗА:N]" short-pause marker (a brief settle/breath pause -
# noticeable but not a full structural break) instead of the full "[ПАУЗА:N]" marker above; gaps
# below this remain unmarked ordinary speech cadence, same as always.
min_micro_pause_seconds: 2.0

# Segments Whisper itself is unsure about get dropped instead of written out, catching
# hallucinations VAD doesn't (e.g. mid-speech mistranscriptions). Tune by inspecting
# result["segments"] on a known-bad file if real speech starts getting cut.
max_no_speech_prob: 0.6   # drop a segment if Whisper thinks it's more likely silence than speech
min_avg_logprob: -1.0     # drop a segment if Whisper's own confidence in its decoding is this low
# Catches repetition-loop hallucinations directly (e.g. "Играет музыка" repeated dozens of
# times) via the gzip compression ratio of the decoded text - this is the same threshold
# Whisper uses internally to trigger a higher-temperature retry, applied here as a final
# filter in case every retry still came back repetitive.
max_compression_ratio: 2.4

# Whisper-default; lets one hallucinated segment bias the decoding of every segment after
# it via the running text context. Off trades a little cross-segment coherence for not
# letting a single bad guess cascade through the rest of the file.
condition_on_previous_text: false
# Biases Whisper's vocabulary toward the speaker's actual jargon (movement/dance terms,
# code-switched English) to reduce mid-word hallucinations like "бедраader" or "chamber today".
# Only strongly affects the first ~224 tokens of context; extend/adjust as you spot recurring
# mis-transcriptions in new recordings.
initial_prompt: >-
  Практика контемпорари и двигательной импровизации. Термины: вытяжение, ось, текстура, импульс,
  амплитуда, многозадачность, бедра, копчик, кагами, thread of the arms, thread of the legs,
  full body experience, range, flow, vibe.
