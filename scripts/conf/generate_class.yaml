src: data/preprocessed        # cleaned transcripts to draw few-shot examples from
dst: data/generated            # generated classes saved here (class_001.txt, class_002.txt, ...)
model: claude-opus-4-6
max_tokens: 8000               # ~1200-1500 Russian words at 15 min fits comfortably; generous headroom
num_classes: 5
num_examples: 3
seed: 0
topic: null                    # strongly recommended for short-form classes — a focused topic
                               # keeps a 15-minute script coherent (e.g. "chain reactions and echo",
                               # "weight and counterbalance", "floating quality in the arms")
digest_path: data/corpus_digest.txt
stats_path: data/corpus_stats.json
target_minutes: 15

pause_scale: 1.0
micro_pause_scale: 1.0         # unused — micro-pause count is no longer targeted numerically

# Three sections instead of four: the short format doesn't support a meaningful two-part main
# section, so the main body is one continuous exploration. Weights are normalized automatically.
sections:
  - name: "arrival / brief grounding and introducing the topic"
    weight: 0.15
  - name: "topic exploration: developing the concept through movement tasks, progressions, and imagery"
    weight: 0.70
  - name: "integration and close: letting the work settle, brief open improvisation, natural ending"
    weight: 0.15
