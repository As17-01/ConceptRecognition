src: data/preprocessed        # cleaned transcripts (artifact-free, no name placeholders) to draw few-shot examples from
dst: data/generated            # folder where generated classes (class_001.txt, class_002.txt, ...) are saved
model: claude-opus-4-6
max_tokens: 24000              # generous headroom; streamed so no HTTP-timeout risk - a ~60min narration at ~140wpm is roughly 8000-9000 Russian words, which can run 12000-16000+ output tokens
num_classes: 5                 # how many classes to generate in this run
num_examples: 3                # transcripts sampled as few-shot style/content reference, per class
seed: 0                        # base seed; class i samples examples with seed + i, so each class gets a different reference set
topic: null                    # optional: e.g. "flow states and points of attention" - applies to every class in the run
digest_path: data/corpus_digest.txt   # corpus-wide style/content patterns written by summarize_corpus.py; folded into the system prompt if present, skipped silently otherwise
stats_path: data/corpus_stats.json    # per-corpus word/pause stats written by summarize_corpus.py; calibrates word/pause targets, falls back to hardcoded defaults if missing
target_minutes: 60             # how long the FINAL AUDIO (after text-to-speech, including realized pause durations) should end up being - around 1 hour, maybe a little longer, per product requirement

# Make the class roomier than the raw corpus average: these multiply the corpus's natural pause /
# micro-pause share of the class, giving more and longer breaks for movement and breath (narration
# shrinks to keep the same target_minutes). 1.0 = corpus-natural; >1 = more space. Clamped in code
# so pauses can never crowd out most of the actual speech.
pause_scale: 1.5               # more and longer structural [ПАУЗА:N] movement/music breaks
micro_pause_scale: 1.4         # more frequent brief [МИКРОПАУЗА:N] settle/breath pauses

# Each class is written as a sequence of continuation passes rather than one shot: a single Opus
# call reliably under-produces on a full ~5000-word Russian narration (came out ~half length), so
# the class is built section by section in a multi-turn conversation, with the total word/pause
# targets split across sections by weight. Each section is a comfortably-sized generation the model
# actually completes, and the running conversation keeps it flowing as one coherent class. Weights
# are normalized automatically, so they need not sum to exactly 1.
sections:
  - name: "разминка / warm-up: arrival, breath, grounding, first gentle mobilizations"
    weight: 0.22
  - name: "основная часть I: the main technical or thematic exploration of the class"
    weight: 0.30
  - name: "основная часть II: development - phrases, traveling, imagery, deeper play with the theme"
    weight: 0.28
  - name: "заключение / close: integration, cool-down, settling, and a natural ending"
    weight: 0.20
