src: data/preprocessed        # cleaned transcripts (artifact-free, no name placeholders) to draw few-shot examples from
dst: data/generated            # folder where generated classes (class_001.txt, class_002.txt, ...) are saved
model: claude-opus-4-8        # see claude-api skill: always use this unless told otherwise
max_tokens: 24000              # generous headroom; streamed so no HTTP-timeout risk - a ~60min narration at ~140wpm is roughly 8000-9000 Russian words, which can run 12000-16000+ output tokens
num_classes: 5                 # how many classes to generate in this run
num_examples: 3                # transcripts sampled as few-shot style/content reference, per class
seed: 0                        # base seed; class i samples examples with seed + i, so each class gets a different reference set
topic: null                    # optional: e.g. "flow states and points of attention" - applies to every class in the run
digest_path: data/corpus_digest.txt   # corpus-wide style/content patterns written by summarize_corpus.py; folded into the system prompt if present, skipped silently otherwise
stats_path: data/corpus_stats.json    # per-corpus word/pause stats written by summarize_corpus.py; calibrates word/pause targets, falls back to hardcoded defaults if missing
target_minutes: 60             # how long the FINAL AUDIO (after text-to-speech, including realized pause durations) should end up being - around 1 hour, maybe a little longer, per product requirement
