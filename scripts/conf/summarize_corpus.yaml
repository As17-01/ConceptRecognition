src: data/preprocessed              # cleaned transcripts to summarize (output of preprocess_transcripts.py)
summaries_dst: data/summaries       # per-file digests (map stage output), one .txt per source file
digest_dst: data/corpus_digest.txt  # single consolidated corpus-level digest (reduce stage output)
stats_dst: data/corpus_stats.json   # exact corpus stats consumed by downstream generation

# Map/reduce model split: the map model runs once per file (129 times) on a mechanical
# extraction task - a cheap/fast model is the right cost/quality tradeoff there. The reduce model
# runs exactly once, synthesizing across all per-file digests, where synthesis quality matters
# most and the input (concatenated digests, not full transcripts) is small either way.
map_model: gpt-6-astra
reduce_model: gpt-6-astra
map_max_tokens: 1024     # ~150-250 word digest per file
reduce_max_tokens: 4096  # a few hundred to ~1000 word consolidated digest

# Assumed speaking rate for Russian instructional narration, folded into corpus_stats.json as
# words_per_minute (used by generate_class.py to translate a target duration into a word-count
# target). Not derived from the corpus itself - a documented assumption; tune if real playback
# rate (post-TTS) differs.
words_per_minute: 140.0
