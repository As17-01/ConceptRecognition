src_dir: data/audio                        # real teacher recordings to sample reference audio from

# Reference-audio sampling for PVC. More total audio gives better training quality — aim for
# 2-3 hours spread across many different sessions so the model sees the voice at different
# intensities, moods, and energy levels across the corpus.
#
# sample_files: optional explicit list of filenames under src_dir. When null, num_source_files
# recordings are auto-picked evenly spread across the sorted recordings for date/session variety.
sample_files: null
num_source_files: 12                       # recordings to draw from (evenly spread across the corpus)
clips_per_file: 3                          # clips extracted per recording (12 × 3 = 36 files total)
clip_seconds: 300                          # 5-minute clips — long enough to capture vocal variety per segment

# Unlike IVC, there's no early-window restriction: PVC's remove_background_noise strips music
# and ambient noise before training, so clips from throughout the recording are fine.
# skip_start_seconds still skips mic-check / "привет" chatter at the very top.
skip_start_seconds: 60
# Skip this many seconds from the END of each recording to avoid student Q&A and conversation
# that typically happens after the class wraps up. Background noise removal handles music,
# but it can't filter out other people's voices — so we exclude the tail entirely.
end_skip_seconds: 900              # skip last 15 minutes

# Key PVC feature: ElevenLabs removes background music and noise from every uploaded clip
# before training. This is the main reason PVC handles this corpus better than IVC.
remove_background_noise: true

# Required by pvc.create (language of the voice being cloned).
language: ru

voice_name: "Anton (dance instructor)"
voice_description: >-
  Male Russian voice, contemporary dance / movement improvisation instructor - calm, instructive tone,
  with occasional English code-switching for dance terminology (flow, full body experience, curves, ...).
# ElevenLabs PVC requires labels as a JSON object — omitting them makes the SDK send "null"
# which the API rejects.
voice_labels:
  language: ru
  gender: male

scratch_dir: data/voice_clone_samples             # extracted reference clips (gitignored)
dst_voice_id_file: data/elevenlabs_voice_id.txt   # written here; synthesize_speech.py reads it

# Cherry-pick mode: after listening to extracted clips, list the best ones here to upload only
# those instead of re-extracting. Filenames relative to scratch_dir. Leave null to auto-extract.
selected_clips: null
# Example after curating:
# selected_clips:
#   - sample_0.mp3
#   - sample_4.mp3
#   - sample_11.mp3
