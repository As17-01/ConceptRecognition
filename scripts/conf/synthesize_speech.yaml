src: data/generated                          # generated class scripts (see generate_class.py)
dst: data/audio_generated                     # folder where synthesized class audio is saved
voice_id_file: data/elevenlabs_voice_id.txt   # written by clone_voice.py
model_id: eleven_multilingual_v2              # explicitly multilingual - needed for Russian + code-switched English
output_format: mp3_44100_128
scratch_dir: data/tts_scratch                 # temp WAV pieces for pause-aware concat (gitignored along with the rest of data/)
language_code: ru                             # force Russian pronunciation/normalization (multilingual_v2 can drift on short segments)

# Voice generation settings (see also preview_voice.py, which shares these). ElevenLabs speed is
# 0.7 (slowest) - 1.2 (fastest), default 1.0; the default came out too fast-paced for a calm
# instructional class, so this is nudged slower. stability/similarity_boost trade expressiveness
# for consistency - higher similarity_boost keeps the clone closer to the reference voice.
voice_settings:
  speed: 0.85           # slower, calmer pacing than the 1.0 default
  stability: 0.5
  similarity_boost: 0.85
  style: 0.0
  use_speaker_boost: true
