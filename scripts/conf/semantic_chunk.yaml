src: data/preprocessed      # folder containing cleaned/punctuated transcript .txt files (see preprocess_transcripts.py)
dst: data/chunks            # folder where chunked transcripts will be saved
model: intfloat/multilingual-e5-large # largest widely-used multilingual sentence-transformers model (560M, 1024-dim)
model_dir: models/sentence_transformers # local cache; run scripts/download_embedding_model.py once with internet, then this works fully offline
query_prefix: "query: "     # e5 models expect inputs prefixed like this, even for symmetric similarity; set to "" for non-e5 models
# Whisper doesn't always add terminal punctuation promptly in run-on speech, so "sentences" can
# run much longer than a real single-topic sentence. Measured on real preprocessed transcripts:
# median sentence length is 8 words, p95 is 40, but the tail runs up to 149. Anything over this
# gets split at comma boundaries (see split_overlong_sentences) before embedding, since a
# 100+-word span is already well past where a sentence-transformer's pooled embedding represents
# one idea usefully.
max_sentence_words: 40
# Chunk boundaries are found by adjacent-sentence agglomerative merging that stops once the best
# remaining merge similarity drops more than boundary_z_score standard deviations below this
# document's own mean merge similarity (see cluster_sentences_by_zscore) - chunk count falls out
# of how topically choppy or smooth each specific transcript is, instead of a fixed average
# sentence count. Absolute cosine similarity doesn't work as a cutoff here: measured on real
# transcripts, even the least-similar merge in a whole document stayed above 0.91, so this has to
# be relative to the document's own distribution. Lower = more, smaller chunks (more sensitive to
# small dips in coherence); higher = fewer, larger chunks. Measured on two real files: 1.0 gave
# 38-48 chunks averaging ~150 words, comparable across both despite very different content.
boundary_z_score: 1.0
# The z-score boundary alone strands short interjections ("Beautiful!", "Ага.") as their own
# chunk - they don't embed like the instructional text around them, so the algorithm reads them
# as a topic shift in both directions, even though a one-word aside isn't a topic of its own.
# Any chunk under this many sentences gets merged into whichever neighbor it's more similar to
# (see merge_short_chunks).
min_chunk_sentences: 3
# A sufficiently coherent stretch may never cross boundary_z_score on its own and can run past
# 300 words - well past where a pooled embedding usefully represents one idea. Any chunk over
# this gets force-split at its weakest internal adjacent-sentence link (see split_long_chunks).
max_chunk_words: 300
