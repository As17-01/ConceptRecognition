[project]
name = "conceptrecognition"
version = "0.1.0"
description = ""
authors = [
    {name = "As17-01",email = "aseliverstov@nes.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-whisper (>=20250625,<20250626)",
    "torch (>=2.6.0,<2.7.0)",
    "numpy (>=1.26,<2.3.0)",
    "hydra-core (>=1.3.3,<2.0.0)",
    "sentence-transformers (>=3.0.0,<4.0.0)",
    "transformers (>=4.40.0,<5.0.0)",
    "sentencepiece (>=0.2.0,<0.2.1)",
    "tiktoken (>=0.7.0,<0.10.0)",
    "scikit-learn (>=1.4.0,<1.8.0)",
    "scipy (>=1.13.0,<1.17.0)",
    "torchaudio (>=2.6.0,<2.7.0)",
    "accelerate (>=1.0.0,<2.0.0)",
    "bitsandbytes (>=0.41.0,<0.42.0)",
    "hdbscan (>=0.8.44,<0.9.0)",
    "umap-learn (>=0.5.12,<0.6.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
